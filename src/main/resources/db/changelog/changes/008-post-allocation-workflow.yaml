databaseChangeLog:
  - changeSet:
      id: 008-post-allocation-workflow
      author: codex
      changes:
        - sql:
            comment: Add the append-only Version 1.5 post-allocation workflow and actionable assignment backfill.
            splitStatements: false
            sql: |
              ALTER TABLE bidding_round ADD COLUMN minimum_open_booking_price integer NOT NULL DEFAULT 1;
              ALTER TABLE bidding_round ADD CONSTRAINT ck_round_minimum_booking_price CHECK (minimum_open_booking_price >= 1);

              ALTER TABLE round_participation ADD COLUMN post_allocation_spend_tokens integer NOT NULL DEFAULT 0;
              ALTER TABLE round_participation DROP CONSTRAINT ck_participation_spend;
              ALTER TABLE round_participation DROP CONSTRAINT ck_participation_remaining;
              ALTER TABLE round_participation ADD CONSTRAINT ck_participation_spend CHECK (
                successful_bid_tokens >= 0 AND post_allocation_spend_tokens >= 0
                AND successful_bid_tokens + post_allocation_spend_tokens <= starting_balance);
              ALTER TABLE round_participation ADD CONSTRAINT ck_participation_remaining CHECK (
                remaining_balance IS NULL OR remaining_balance = starting_balance - successful_bid_tokens - post_allocation_spend_tokens);

              ALTER TABLE employee_notification_settings ADD COLUMN seat_offer_notifications_enabled boolean NOT NULL DEFAULT false;

              CREATE TABLE round_date_capacity_state (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_date_id bigint NOT NULL,
                morning_occupied integer NOT NULL DEFAULT 0,
                afternoon_occupied integer NOT NULL DEFAULT 0,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_capacity_state_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT uq_capacity_state_date UNIQUE (round_date_id),
                CONSTRAINT ck_capacity_state_counts CHECK (morning_occupied >= 0 AND afternoon_occupied >= 0)
              );

              CREATE TABLE seat_occupancy (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_date_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                attendance_period varchar(20) NOT NULL,
                physical_seat_id bigint,
                source_type varchar(24) NOT NULL,
                original_seat_assignment_id bigint,
                status varchar(16) NOT NULL,
                occupied_at timestamptz NOT NULL,
                relinquished_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_occupancy_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT fk_occupancy_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT fk_occupancy_physical_seat FOREIGN KEY (physical_seat_id) REFERENCES physical_seat(id),
                CONSTRAINT fk_occupancy_assignment FOREIGN KEY (original_seat_assignment_id) REFERENCES seat_assignment(id),
                CONSTRAINT ck_occupancy_period CHECK (attendance_period IN ('FULL_DAY','MORNING_ONLY','AFTERNOON_ONLY')),
                CONSTRAINT ck_occupancy_source CHECK (source_type IN ('ORIGINAL_ASSIGNMENT','WAITLIST_CLAIM','OPEN_BOOKING','ORIGINAL_REBOOKING')),
                CONSTRAINT ck_occupancy_status CHECK (status IN ('ACTIVE','RELINQUISHED')),
                CONSTRAINT ck_occupancy_terminal CHECK ((status = 'ACTIVE' AND relinquished_at IS NULL) OR (status = 'RELINQUISHED' AND relinquished_at IS NOT NULL)),
                CONSTRAINT ck_occupancy_lineage CHECK ((source_type IN ('ORIGINAL_ASSIGNMENT','ORIGINAL_REBOOKING') AND original_seat_assignment_id IS NOT NULL) OR (source_type IN ('WAITLIST_CLAIM','OPEN_BOOKING') AND original_seat_assignment_id IS NULL))
              );
              CREATE UNIQUE INDEX uq_active_employee_occupancy ON seat_occupancy (round_date_id, employee_id) WHERE status = 'ACTIVE';
              CREATE UNIQUE INDEX uq_original_assignment_occupancy ON seat_occupancy (original_seat_assignment_id) WHERE source_type = 'ORIGINAL_ASSIGNMENT';
              CREATE INDEX ix_occupancy_date_status ON seat_occupancy (round_date_id, status);
              CREATE INDEX ix_occupancy_seat_status ON seat_occupancy (round_date_id, physical_seat_id, status) WHERE physical_seat_id IS NOT NULL;

              CREATE TABLE assignment_relinquishment (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                seat_occupancy_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                round_date_id bigint NOT NULL,
                attendance_period varchar(20) NOT NULL,
                released_physical_seat_id bigint,
                released_seat_number integer,
                released_at timestamptz NOT NULL,
                offer_deadline timestamptz NOT NULL,
                original_assignment boolean NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_relinquishment_occupancy FOREIGN KEY (seat_occupancy_id) REFERENCES seat_occupancy(id),
                CONSTRAINT fk_relinquishment_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT fk_relinquishment_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT fk_relinquishment_seat FOREIGN KEY (released_physical_seat_id) REFERENCES physical_seat(id),
                CONSTRAINT uq_relinquishment_occupancy UNIQUE (seat_occupancy_id),
                CONSTRAINT ck_relinquishment_deadline CHECK (offer_deadline > released_at),
                CONSTRAINT ck_relinquishment_period CHECK (attendance_period IN ('FULL_DAY','MORNING_ONLY','AFTERNOON_ONLY')),
                CONSTRAINT ck_relinquishment_seat_snapshot CHECK ((released_physical_seat_id IS NULL) = (released_seat_number IS NULL))
              );

              CREATE TABLE relinquishment_credit (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                seat_assignment_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                round_id bigint NOT NULL,
                initial_tokens integer NOT NULL,
                remaining_tokens integer NOT NULL,
                expires_at timestamptz NOT NULL,
                fully_consumed_at timestamptz,
                expired_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_credit_assignment FOREIGN KEY (seat_assignment_id) REFERENCES seat_assignment(id),
                CONSTRAINT fk_credit_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT fk_credit_round FOREIGN KEY (round_id) REFERENCES bidding_round(id),
                CONSTRAINT uq_credit_assignment UNIQUE (seat_assignment_id),
                CONSTRAINT ck_credit_tokens CHECK (initial_tokens > 0 AND remaining_tokens >= 0 AND remaining_tokens <= initial_tokens),
                CONSTRAINT ck_credit_terminal CHECK (NOT (fully_consumed_at IS NOT NULL AND expired_at IS NOT NULL))
              );
              CREATE INDEX ix_credit_funding ON relinquishment_credit (employee_id, round_id, expires_at, id) WHERE remaining_tokens > 0;

              CREATE TABLE released_capacity_offer (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                assignment_relinquishment_id bigint NOT NULL,
                round_date_id bigint NOT NULL,
                attendance_period varchar(20) NOT NULL,
                initial_morning_capacity integer NOT NULL,
                initial_afternoon_capacity integer NOT NULL,
                deadline timestamptz NOT NULL,
                status varchar(16) NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_offer_relinquishment FOREIGN KEY (assignment_relinquishment_id) REFERENCES assignment_relinquishment(id),
                CONSTRAINT fk_offer_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT uq_offer_relinquishment UNIQUE (assignment_relinquishment_id),
                CONSTRAINT ck_offer_period CHECK (attendance_period IN ('FULL_DAY','MORNING_ONLY','AFTERNOON_ONLY')),
                CONSTRAINT ck_offer_capacity CHECK (initial_morning_capacity >= 0 AND initial_afternoon_capacity >= 0),
                CONSTRAINT ck_offer_status CHECK (status IN ('ACTIVE','EXHAUSTED','FILLED','EXPIRED'))
              );
              CREATE INDEX ix_offer_date_status_deadline ON released_capacity_offer (round_date_id, status, deadline, id);

              CREATE TABLE seat_offer_candidate (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                offer_id bigint NOT NULL,
                round_date_id bigint NOT NULL,
                bid_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                attendance_period varchar(20) NOT NULL,
                tier_tokens integer NOT NULL,
                required_tokens integer NOT NULL,
                status varchar(40) NOT NULL,
                offered_at timestamptz NOT NULL,
                responded_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_candidate_offer FOREIGN KEY (offer_id) REFERENCES released_capacity_offer(id),
                CONSTRAINT fk_candidate_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT fk_candidate_bid FOREIGN KEY (bid_id) REFERENCES bid(id),
                CONSTRAINT fk_candidate_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT uq_candidate_offer_bid UNIQUE (offer_id, bid_id),
                CONSTRAINT ck_candidate_period CHECK (attendance_period IN ('FULL_DAY','MORNING_ONLY','AFTERNOON_ONLY')),
                CONSTRAINT ck_candidate_tokens CHECK (tier_tokens > 0 AND required_tokens = tier_tokens),
                CONSTRAINT ck_candidate_status CHECK (status IN ('PENDING','CLAIMED','DECLINED','AUTO_DECLINED_INSUFFICIENT_FUNDS','CLAIMED_BY_OTHER','EXPIRED')),
                CONSTRAINT ck_candidate_response CHECK ((status = 'PENDING' AND responded_at IS NULL) OR (status <> 'PENDING' AND responded_at IS NOT NULL))
              );
              CREATE INDEX ix_candidate_offer_tier ON seat_offer_candidate (offer_id, status, tier_tokens DESC, id);
              CREATE INDEX ix_candidate_employee ON seat_offer_candidate (employee_id, created_at DESC);
              CREATE UNIQUE INDEX uq_pending_candidate_employee_date ON seat_offer_candidate (employee_id, round_date_id) WHERE status = 'PENDING';
              CREATE TABLE post_allocation_booking (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                seat_occupancy_id bigint NOT NULL,
                booking_type varchar(24) NOT NULL,
                offer_candidate_id bigint,
                required_tokens integer NOT NULL,
                credit_tokens_spent integer NOT NULL DEFAULT 0,
                ordinary_tokens_spent integer NOT NULL DEFAULT 0,
                ordinary_participation_id bigint,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_booking_occupancy FOREIGN KEY (seat_occupancy_id) REFERENCES seat_occupancy(id),
                CONSTRAINT fk_booking_candidate FOREIGN KEY (offer_candidate_id) REFERENCES seat_offer_candidate(id),
                CONSTRAINT fk_booking_participation FOREIGN KEY (ordinary_participation_id) REFERENCES round_participation(id),
                CONSTRAINT uq_booking_occupancy UNIQUE (seat_occupancy_id),
                CONSTRAINT uq_booking_candidate UNIQUE (offer_candidate_id),
                CONSTRAINT ck_booking_type CHECK (booking_type IN ('WAITLIST_CLAIM','OPEN_BOOKING','ORIGINAL_REBOOKING')),
                CONSTRAINT ck_booking_tokens CHECK (required_tokens > 0 AND credit_tokens_spent >= 0 AND ordinary_tokens_spent >= 0 AND credit_tokens_spent + ordinary_tokens_spent = required_tokens),
                CONSTRAINT ck_booking_candidate CHECK ((booking_type = 'WAITLIST_CLAIM') = (offer_candidate_id IS NOT NULL)),
                CONSTRAINT ck_booking_participation CHECK ((ordinary_tokens_spent > 0) = (ordinary_participation_id IS NOT NULL))
              );

              CREATE TABLE post_allocation_booking_credit (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                booking_id bigint NOT NULL,
                relinquishment_credit_id bigint NOT NULL,
                tokens integer NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_booking_credit_booking FOREIGN KEY (booking_id) REFERENCES post_allocation_booking(id),
                CONSTRAINT fk_booking_credit_credit FOREIGN KEY (relinquishment_credit_id) REFERENCES relinquishment_credit(id),
                CONSTRAINT uq_booking_credit UNIQUE (booking_id, relinquishment_credit_id),
                CONSTRAINT ck_booking_credit_tokens CHECK (tokens > 0)
              );

              CREATE TABLE seat_offer_notification_dispatch (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                candidate_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                status varchar(20) NOT NULL,
                subscription_count integer NOT NULL DEFAULT 0,
                accepted_count integer NOT NULL DEFAULT 0,
                failed_count integer NOT NULL DEFAULT 0,
                completed_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_offer_dispatch_candidate FOREIGN KEY (candidate_id) REFERENCES seat_offer_candidate(id),
                CONSTRAINT fk_offer_dispatch_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT uq_offer_dispatch_candidate UNIQUE (candidate_id),
                CONSTRAINT ck_offer_dispatch_status CHECK (status IN ('PENDING','PROCESSING','COMPLETED','PARTIAL','FAILED')),
                CONSTRAINT ck_offer_dispatch_counts CHECK (subscription_count >= 0 AND accepted_count >= 0 AND failed_count >= 0 AND accepted_count + failed_count <= subscription_count)
              );

              CREATE TABLE seat_offer_delivery_attempt (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                dispatch_id bigint NOT NULL,
                push_subscription_id bigint NOT NULL,
                outcome varchar(24) NOT NULL,
                provider_status integer,
                attempted_at timestamptz NOT NULL,
                CONSTRAINT fk_offer_attempt_dispatch FOREIGN KEY (dispatch_id) REFERENCES seat_offer_notification_dispatch(id),
                CONSTRAINT fk_offer_attempt_subscription FOREIGN KEY (push_subscription_id) REFERENCES web_push_subscription(id),
                CONSTRAINT uq_offer_attempt UNIQUE (dispatch_id, push_subscription_id),
                CONSTRAINT ck_offer_attempt_outcome CHECK (outcome IN ('ACCEPTED','TEMPORARY_FAILURE','PERMANENT_FAILURE'))
              );

              ALTER TABLE token_ledger ADD COLUMN participation_id bigint;
              ALTER TABLE token_ledger ADD COLUMN post_allocation_booking_id bigint;
              ALTER TABLE token_ledger ADD COLUMN relinquishment_credit_id bigint;
              ALTER TABLE token_ledger ADD CONSTRAINT fk_ledger_participation FOREIGN KEY (participation_id) REFERENCES round_participation(id);
              ALTER TABLE token_ledger ADD CONSTRAINT fk_ledger_booking FOREIGN KEY (post_allocation_booking_id) REFERENCES post_allocation_booking(id);
              ALTER TABLE token_ledger ADD CONSTRAINT fk_ledger_credit FOREIGN KEY (relinquishment_credit_id) REFERENCES relinquishment_credit(id);
              ALTER TABLE token_ledger DROP CONSTRAINT ck_ledger_type;
              ALTER TABLE token_ledger ADD CONSTRAINT ck_ledger_type CHECK (type IN ('GRANT','CARRY_IN','BID_SPEND','POST_ALLOCATION_SPEND','RELINQUISHMENT_CREDIT','CREDIT_SPEND','CREDIT_EXPIRY','EXPIRY'));
              CREATE INDEX ix_ledger_participation ON token_ledger (participation_id);
              CREATE INDEX ix_ledger_booking ON token_ledger (post_allocation_booking_id);
              CREATE INDEX ix_ledger_credit ON token_ledger (relinquishment_credit_id);

              CREATE FUNCTION enforce_active_occupancy() RETURNS trigger AS $$
              DECLARE existing_period varchar(20);
              BEGIN
                IF NEW.status <> 'ACTIVE' THEN RETURN NEW; END IF;
                PERFORM 1 FROM round_date WHERE id = NEW.round_date_id FOR UPDATE;
                IF NEW.physical_seat_id IS NOT NULL THEN
                  IF EXISTS (SELECT 1 FROM reserved_guest_seat_assignment g WHERE g.round_date_id = NEW.round_date_id AND g.physical_seat_id = NEW.physical_seat_id) THEN
                    RAISE EXCEPTION 'physical seat is reserved for an anonymous guest';
                  END IF;
                  SELECT o.attendance_period INTO existing_period FROM seat_occupancy o
                    WHERE o.round_date_id = NEW.round_date_id AND o.physical_seat_id = NEW.physical_seat_id
                      AND o.status = 'ACTIVE' AND o.id IS DISTINCT FROM NEW.id
                      AND (NEW.attendance_period = 'FULL_DAY' OR o.attendance_period = 'FULL_DAY' OR o.attendance_period = NEW.attendance_period)
                    LIMIT 1;
                  IF existing_period IS NOT NULL THEN RAISE EXCEPTION 'physical seat period is already occupied'; END IF;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
              CREATE TRIGGER trg_active_occupancy BEFORE INSERT OR UPDATE OF round_date_id, physical_seat_id, attendance_period, status
                ON seat_occupancy FOR EACH ROW EXECUTE FUNCTION enforce_active_occupancy();

              INSERT INTO round_date_capacity_state (round_date_id, morning_occupied, afternoon_occupied)
              SELECT rd.id,
                count(*) FILTER (WHERE sa.attendance_period IN ('FULL_DAY','MORNING_ONLY')),
                count(*) FILTER (WHERE sa.attendance_period IN ('FULL_DAY','AFTERNOON_ONLY'))
              FROM round_date rd
              JOIN bidding_round br ON br.id = rd.round_id AND br.status = 'COMPLETED'
              LEFT JOIN seat_assignment sa ON sa.round_date_id = rd.id AND sa.assigned
              WHERE (rd.target_date + 1)::timestamp AT TIME ZONE br.schedule_zone > now()
              GROUP BY rd.id;

              INSERT INTO seat_occupancy (round_date_id, employee_id, attendance_period, physical_seat_id,
                source_type, original_seat_assignment_id, status, occupied_at)
              SELECT sa.round_date_id, rp.employee_id, sa.attendance_period, au.physical_seat_id,
                'ORIGINAL_ASSIGNMENT', sa.id, 'ACTIVE', br.processed_at
              FROM seat_assignment sa
              JOIN allocation_unit au ON au.id = sa.allocation_unit_id
              JOIN bid b ON b.id = sa.bid_id
              JOIN round_participation rp ON rp.id = b.participation_id
              JOIN round_date rd ON rd.id = sa.round_date_id
              JOIN bidding_round br ON br.id = rd.round_id
              WHERE sa.assigned AND br.status = 'COMPLETED'
                AND (rd.target_date + 1)::timestamp AT TIME ZONE br.schedule_zone > now();

              CREATE INDEX ix_relinquishment_date ON assignment_relinquishment (round_date_id, released_at);
              CREATE INDEX ix_booking_candidate ON post_allocation_booking (offer_candidate_id);
              CREATE INDEX ix_offer_dispatch_status ON seat_offer_notification_dispatch (status, created_at);
              CREATE INDEX ix_offer_attempt_subscription ON seat_offer_delivery_attempt (push_subscription_id);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_active_occupancy ON seat_occupancy;
              DROP FUNCTION IF EXISTS enforce_active_occupancy();
              ALTER TABLE token_ledger DROP COLUMN IF EXISTS relinquishment_credit_id;
              ALTER TABLE token_ledger DROP COLUMN IF EXISTS post_allocation_booking_id;
              ALTER TABLE token_ledger DROP COLUMN IF EXISTS participation_id;
              DROP TABLE IF EXISTS seat_offer_delivery_attempt;
              DROP TABLE IF EXISTS seat_offer_notification_dispatch;
              DROP TABLE IF EXISTS post_allocation_booking_credit;
              DROP TABLE IF EXISTS post_allocation_booking;
              DROP TABLE IF EXISTS seat_offer_candidate;
              DROP TABLE IF EXISTS released_capacity_offer;
              DROP TABLE IF EXISTS relinquishment_credit;
              DROP TABLE IF EXISTS assignment_relinquishment;
              DROP TABLE IF EXISTS seat_occupancy;
              DROP TABLE IF EXISTS round_date_capacity_state;
              ALTER TABLE employee_notification_settings DROP COLUMN IF EXISTS seat_offer_notifications_enabled;
              ALTER TABLE round_participation DROP COLUMN IF EXISTS post_allocation_spend_tokens;
              ALTER TABLE bidding_round DROP COLUMN IF EXISTS minimum_open_booking_price;