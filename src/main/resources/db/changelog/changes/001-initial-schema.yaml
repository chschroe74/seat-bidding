databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: chschroe
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE employee (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                email varchar(320) NOT NULL,
                first_name varchar(255) NOT NULL,
                last_name varchar(255) NOT NULL,
                password_hash varchar(512),
                password_set_at timestamptz,
                enabled boolean NOT NULL DEFAULT true,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_employee_email UNIQUE (email),
                CONSTRAINT ck_employee_email_normalized CHECK (email = lower(btrim(email)) AND email <> ''),
                CONSTRAINT ck_employee_first_name_nonblank CHECK (btrim(first_name) <> ''),
                CONSTRAINT ck_employee_last_name_nonblank CHECK (btrim(last_name) <> ''),
                CONSTRAINT ck_employee_password_state CHECK ((password_hash IS NULL) = (password_set_at IS NULL))
              );

              CREATE TABLE account_activation (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                employee_id bigint NOT NULL,
                code_digest varchar(255),
                code_expires_at timestamptz,
                failed_attempts integer NOT NULL DEFAULT 0,
                last_sent_at timestamptz,
                activation_token_hash varchar(64),
                activation_token_expires_at timestamptz,
                verified_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_activation_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT uq_activation_employee UNIQUE (employee_id),
                CONSTRAINT uq_activation_token_hash UNIQUE (activation_token_hash),
                CONSTRAINT ck_activation_attempts CHECK (failed_attempts >= 0),
                CONSTRAINT ck_activation_code_pair CHECK ((code_digest IS NULL) = (code_expires_at IS NULL)),
                CONSTRAINT ck_activation_token_pair CHECK ((activation_token_hash IS NULL) = (activation_token_expires_at IS NULL)),
                CONSTRAINT ck_activation_exclusive CHECK (code_digest IS NULL OR activation_token_hash IS NULL),
                CONSTRAINT ck_activation_verified CHECK (activation_token_hash IS NULL OR verified_at IS NOT NULL)
              );
              CREATE INDEX ix_activation_employee ON account_activation(employee_id);

              CREATE TABLE bidding_round (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                status varchar(20) NOT NULL,
                sequence_no bigint NOT NULL,
                bidding_opens_at timestamptz NOT NULL,
                cutoff_at timestamptz NOT NULL,
                schedule_zone varchar(64) NOT NULL,
                tokens_granted integer NOT NULL,
                carry_over_cap integer NOT NULL,
                seat_capacity integer NOT NULL,
                processing_started_at timestamptz,
                processed_at timestamptz,
                predecessor_round_id bigint,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_round_sequence UNIQUE (sequence_no),
                CONSTRAINT uq_round_cutoff UNIQUE (cutoff_at),
                CONSTRAINT uq_round_predecessor UNIQUE (predecessor_round_id),
                CONSTRAINT fk_round_predecessor FOREIGN KEY (predecessor_round_id) REFERENCES bidding_round(id),
                CONSTRAINT ck_round_status CHECK (status IN ('OPEN','PROCESSING','COMPLETED','FAILED')),
                CONSTRAINT ck_round_tokens CHECK (tokens_granted >= 0),
                CONSTRAINT ck_round_carry CHECK (carry_over_cap >= 0),
                CONSTRAINT ck_round_capacity CHECK (seat_capacity >= 1),
                CONSTRAINT ck_round_window CHECK (bidding_opens_at < cutoff_at)
              );
              CREATE UNIQUE INDEX uq_one_open_round ON bidding_round ((status)) WHERE status = 'OPEN';
              CREATE INDEX ix_round_predecessor ON bidding_round(predecessor_round_id);
              CREATE INDEX ix_round_status_cutoff ON bidding_round(status, cutoff_at);

              CREATE TABLE round_date (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_id bigint NOT NULL,
                target_date date NOT NULL,
                ordinal smallint NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_round_date_round FOREIGN KEY (round_id) REFERENCES bidding_round(id),
                CONSTRAINT uq_round_date UNIQUE (round_id, target_date),
                CONSTRAINT uq_round_ordinal UNIQUE (round_id, ordinal),
                CONSTRAINT ck_round_ordinal CHECK (ordinal BETWEEN 1 AND 5),
                CONSTRAINT ck_round_weekday CHECK (extract(isodow from target_date) BETWEEN 1 AND 5)
              );
              CREATE INDEX ix_round_date_round ON round_date(round_id);

              CREATE TABLE round_participation (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_id bigint NOT NULL,
                employee_id bigint NOT NULL,
                grant_tokens integer NOT NULL,
                carried_in_tokens integer NOT NULL,
                starting_balance integer NOT NULL,
                successful_bid_tokens integer NOT NULL DEFAULT 0,
                remaining_balance integer,
                carried_out_tokens integer,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_participation_round FOREIGN KEY (round_id) REFERENCES bidding_round(id),
                CONSTRAINT fk_participation_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT uq_participation UNIQUE (round_id, employee_id),
                CONSTRAINT ck_participation_grant CHECK (grant_tokens >= 0),
                CONSTRAINT ck_participation_carry_in CHECK (carried_in_tokens >= 0),
                CONSTRAINT ck_participation_start CHECK (starting_balance = grant_tokens + carried_in_tokens),
                CONSTRAINT ck_participation_spend CHECK (successful_bid_tokens >= 0 AND successful_bid_tokens <= starting_balance),
                CONSTRAINT ck_participation_remaining CHECK (remaining_balance IS NULL OR remaining_balance = starting_balance - successful_bid_tokens),
                CONSTRAINT ck_participation_carry_out CHECK (carried_out_tokens IS NULL OR carried_out_tokens >= 0)
              );
              CREATE INDEX ix_participation_round ON round_participation(round_id);
              CREATE INDEX ix_participation_employee ON round_participation(employee_id);

              CREATE TABLE bid (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_date_id bigint NOT NULL,
                participation_id bigint NOT NULL,
                tokens integer NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_bid_round_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT fk_bid_participation FOREIGN KEY (participation_id) REFERENCES round_participation(id),
                CONSTRAINT uq_bid_date_participation UNIQUE (round_date_id, participation_id),
                CONSTRAINT ck_bid_tokens CHECK (tokens > 0)
              );
              CREATE INDEX ix_bid_round_date ON bid(round_date_id);
              CREATE INDEX ix_bid_participation ON bid(participation_id);

              CREATE TABLE seat_assignment (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                round_date_id bigint NOT NULL,
                bid_id bigint NOT NULL,
                assigned boolean NOT NULL,
                final_rank integer NOT NULL,
                tie_group varchar(64),
                draw_value varchar(255),
                algorithm_version varchar(32) NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_assignment_round_date FOREIGN KEY (round_date_id) REFERENCES round_date(id),
                CONSTRAINT fk_assignment_bid FOREIGN KEY (bid_id) REFERENCES bid(id),
                CONSTRAINT uq_assignment_bid UNIQUE (bid_id),
                CONSTRAINT uq_assignment_rank UNIQUE (round_date_id, final_rank),
                CONSTRAINT ck_assignment_rank CHECK (final_rank >= 1)
              );
              CREATE INDEX ix_assignment_round_date ON seat_assignment(round_date_id);

              CREATE TABLE token_ledger (
                id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                employee_id bigint NOT NULL,
                round_id bigint NOT NULL,
                bid_id bigint,
                type varchar(32) NOT NULL,
                amount integer NOT NULL,
                idempotency_key varchar(255) NOT NULL,
                occurred_at timestamptz NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT fk_ledger_employee FOREIGN KEY (employee_id) REFERENCES employee(id),
                CONSTRAINT fk_ledger_round FOREIGN KEY (round_id) REFERENCES bidding_round(id),
                CONSTRAINT fk_ledger_bid FOREIGN KEY (bid_id) REFERENCES bid(id),
                CONSTRAINT uq_ledger_idempotency UNIQUE (idempotency_key),
                CONSTRAINT ck_ledger_type CHECK (type IN ('GRANT','CARRY_IN','BID_SPEND','EXPIRY')),
                CONSTRAINT ck_ledger_amount CHECK (amount <> 0)
              );
              CREATE INDEX ix_ledger_employee ON token_ledger(employee_id);
              CREATE INDEX ix_ledger_round ON token_ledger(round_id);
              CREATE INDEX ix_ledger_bid ON token_ledger(bid_id);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE token_ledger;
              DROP TABLE seat_assignment;
              DROP TABLE bid;
              DROP TABLE round_participation;
              DROP TABLE round_date;
              DROP TABLE bidding_round;
              DROP TABLE account_activation;
              DROP TABLE employee;
